name: Zbuduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Niezbędne do utworzenia GitHub Release przez GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tylko zmiana www/index.html idzie przez OTA.
      # Każda inna zmiana (np. README, ikony, obrazy, powiadomienia,
      # skrypty lub pliki natywne) publikuje stabilne wydanie APK.
      - name: Rozpoznaj rodzaj aktualizacji
        id: kind
        shell: bash
        run: |
          native=true
          BEFORE="${{ github.event.before }}"

          if [ "${{ github.event_name }}" = "push" ] && \
             [ -n "$BEFORE" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE" HEAD)"
            if [ -n "$CHANGED" ] && \
               ! printf '%s\n' "$CHANGED" | grep -qv '^www/index.html$'; then
              native=false
            fi
          fi

          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Aktualizacja natywna: $native"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Zależności
        run: npm install

      - name: Projekt Androida
        run: npx cap add android

      - name: Ikony, uprawnienia, splash i kod aktualizacji
        run: python3 native/patch_android.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Synchronizacja
        run: npx cap sync android

      - name: Licencje Androida
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Stały klucz podpisu (ten sam przy każdym buildzie)
        run: mkdir -p ~/.android && cp native/debug.keystore ~/.android/debug.keystore

      - name: Budowanie APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Przygotuj APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Silownia.apk

      # Zachowujemy Artifact w Actions, tak jak wcześniej.
      - name: Zapisz APK jako Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silownia-APK
          path: Silownia.apk
          if-no-files-found: error

      # Publikujemy APK jako asset GitHub Release.
      # Aplikacja sprawdza /releases/latest i szuka pliku .apk.
      - name: Opublikuj APK w GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ github.run_number }}
          name: Siłownia 2.${{ github.run_number }}
          files: Silownia.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.kind.outputs.native != 'true' }}
          make_latest: ${{ steps.kind.outputs.native == 'true' && 'true' || 'false' }}
