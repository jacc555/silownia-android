name: Zbuduj APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Jedynie zmiana www/index.html może być dostarczona przez OTA.
      # Każda inna zmiana (w tym zasoby, ikony i pliki natywne)
      # powoduje opublikowanie stabilnego APK.
      - name: Rozpoznaj rodzaj zmian
        id: kind
        shell: bash
        run: |
          native=true
          BEFORE="${{ github.event.before }}"

          if [ "${{ github.event_name }}" = "push" ] && \
             [ -n "$BEFORE" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "$BEFORE" 2>/dev/null; then

            CHANGED="$(git diff --name-only "$BEFORE" HEAD)"
            if [ -n "$CHANGED" ] && \
               ! printf '%s\n' "$CHANGED" | grep -qv '^www/index.html$'; then
              native=false
            fi
          fi

          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Typ wydania: $([ "$native" = true ] && echo natywne || echo tylko-OTA)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Zależności
        run: npm install

      - name: Projekt Androida
        run: npx cap add android

      - name: Ikony, uprawnienia, splash i kod aktualizacji
        run: python3 native/patch_android.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Synchronizacja
        run: npx cap sync android

      - name: Licencje Androida
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Stały klucz podpisu
        run: |
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore

      - name: Budowanie APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Przygotuj plik APK do wydania
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Silownia.apk

      # Każdy build trafia do Releases. Tylko stabilny (natywny)
      # Release jest wskazywany przez /releases/latest w aplikacji.
      - name: Opublikuj APK w GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Siłownia 2.${{ github.run_number }}
          files: Silownia.apk
          fail_on_unmatched_files: true
          prerelease: ${{ steps.kind.outputs.native != 'true' }}
          make_latest: ${{ steps.kind.outputs.native == 'true' && 'true' || 'false' }}
