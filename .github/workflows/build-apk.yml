name: Zbuduj APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Zależności
        run: npm install
      - name: Projekt Androida
        run: npx cap add android
      - name: Ikony, uprawnienia, splash
        run: python3 native/patch_android.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - name: Synchronizacja
        run: npx cap sync android
      - name: Licencje Androida
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Stały klucz podpisu (ten sam przy każdym buildzie)
        run: mkdir -p ~/.android && cp native/debug.keystore ~/.android/debug.keystore
      - name: Budowanie APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Silownia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
